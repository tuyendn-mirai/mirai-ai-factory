services:
  # Mock AWS Secrets Manager cho local dev — chạy NGOÀI cluster mirai-eks,
  # giống cách Postgres/Redis/Ollama khác đều là "server ngoài" trong
  # docker-compose.yml ở gốc repo. Lý do dựng ngoài thay vì trong k8s: trên
  # EKS thật, Secrets Manager là managed service nằm ngoài cluster — pod gọi
  # ra ngoài qua endpoint AWS chứ Secrets Manager không chạy như workload
  # trong cluster. Xem docs/INFRA_K3D_EKS.md mục LocalStack.
  #
  # Pod trong mirai-eks gọi vào đây qua http://host.k3d.internal:4566
  # (hostname này k3d tự tạo sẵn khi tạo cluster, trỏ về gateway của host).
  localstack:
    # 4.13.1 (bản cũ, trước khi có LOCALSTACK_AUTH_TOKEN) KHÔNG nhận đúng
    # license Student dù set token — build quá cũ, chưa tích hợp license
    # flow cho tier này (log không hề có dòng "licensingv2 ... activated"),
    # nên PERSISTENCE/ENFORCE_IAM set mà không chạy. Đổi sang bản đã tự test
    # thật: log có "Successfully requested and activated new license
    # ...:student", secret sống sót qua restart, role gắn Deny policy bị
    # AccessDeniedException đúng như AWS thật — cả 2 đều hoạt động.
    image: localstack/localstack:2026.7.5
    container_name: mirai-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=secretsmanager,iam,sts
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=1
      - ENFORCE_IAM=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in localstack/.env (bản Student, xem localstack/.env.example) — không hard-code token thật vào file này, file này commit lên git}
    volumes:
      - "./volume:/var/lib/localstack"
    restart: unless-stopped

  stackport:
    image: davireis/stackport:0.3.9
    container_name: mirai-stackport
    depends_on:
      - localstack
    ports:
      - "8090:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=ap-northeast-1
    restart: unless-stopped
