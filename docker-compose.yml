services:
  # ── Tầng 3 — AI Model Catalog (Hub) ──
  # LiteLLM Proxy tự thân là Registry + API thống nhất, không có lớp
  # FastAPI tự viết ở giữa. Xem layer3-litellm/config.yaml.
  #
  # Model backend (Ollama) và audit-log backend (Postgres) đều là dịch vụ
  # đã dựng sẵn ở SERVER KHÁC — không chạy trong compose này. Chỉ cần trỏ
  # OLLAMA_BASE_URL và DATABASE_URL tới chúng.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: mirai-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./layer3-litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-mirai-local}
      # Postgres có sẵn, ví dụ postgresql://user:pass@192.168.1.50:5432/litellm
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env, e.g. postgresql://user:pass@<postgres-host>:5432/litellm}
      # Ollama server có sẵn, ví dụ http://192.168.1.50:11434 — không cần key.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in .env, e.g. http://<ollama-server>:11434}
      # Redis ngoài (cùng server với Langfuse, KHÁC DB index — xem REDIS_DB)
      # để cache response, không đụng key của Langfuse.
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST in .env}
      - REDIS_PORT=${REDIS_PORT:?set REDIS_PORT in .env}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - REDIS_DB=${LITELLM_REDIS_DB:-1}
      # Gửi trace request/response sang Langfuse (self-host, service
      # langfuse-web bên dưới) — dùng chung project/key với Langflow nên
      # trace của Tầng 3 và Tầng 4 nằm chung 1 chỗ để đối chiếu.
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse-web:3000
      # Chỉ cần điền nếu bật thêm entry vendor thật trong config.yaml.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-east-1}
      - STORE_MODEL_IN_DB=true
      - LITELLM_DROP_PARAMS=true
    depends_on:
      - langfuse-web
    restart: unless-stopped

  # ── Tầng 4 — Agent & Workflow Factory ──
  # Langflow chỉ được cấu hình trỏ vào http://litellm:4000 (một API thống
  # nhất). Không cài thêm plugin/custom component gọi thẳng vendor.
  #
  # DB của Langflow trỏ ra Postgres ngoài (KHÔNG dùng SQLite mặc định trong
  # container) — để flow/lịch sử chat không bị mất mỗi khi container bị
  # recreate (ví dụ khi đổi biến môi trường như lần fix SSRF trước).
  langflow:
    image: langflowai/langflow:latest
    container_name: mirai-langflow
    ports:
      - "7860:7860"
    environment:
      # Tắt auto-login, bắt buộc đăng nhập bằng user/password riêng.
      - LANGFLOW_AUTO_LOGIN=false
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER:?set LANGFLOW_SUPERUSER in .env}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD:?set LANGFLOW_SUPERUSER_PASSWORD in .env}
      - MIRAI_HUB_BASE_URL=http://litellm:4000
      # SSRF protection của Langflow chặn mọi hostname nội bộ theo mặc định
      # — phải allowlist "litellm" và "langfuse-web" thì Agent/OpenAI
      # component mới gọi được sang các service khác trong docker network.
      - LANGFLOW_SSRF_ALLOWED_HOSTS=litellm,langfuse-web
      # Postgres ngoài — dùng DATABASE riêng (ví dụ "langflow"), không phải
      # schema, vì Langflow dùng SQLAlchemy (không phải Prisma như LiteLLM).
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL:?set LANGFLOW_DATABASE_URL in .env, e.g. postgresql://user:pass@<postgres-host>:5432/langflow}
      # Tracing sang Langfuse (self-host, xem service langfuse-web bên dưới).
      # Điền LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY SAU khi tạo project đầu
      # tiên trên http://localhost:3000 (Settings > API Keys) — xem README.
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse-web:3000
    depends_on:
      - litellm
      - langfuse-web
    restart: unless-stopped

  # ── Langfuse (self-host) — LLM observability cho Tầng 4 ──
  # Chỉ 2 service app (web/worker) chạy trong compose này. Toàn bộ hạ tầng
  # phụ trợ mà Langfuse v3 cần — Postgres (metadata), ClickHouse
  # (trace/analytics), Redis (queue), MinIO/S3 (blob sự kiện) — đều là
  # SERVER NGOÀI đã dựng sẵn, không chạy container nào ở đây.
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: mirai-langfuse-worker
    environment:
      # Postgres ngoài, DATABASE riêng (ví dụ "langfuse") — không dùng chung
      # database/schema với LiteLLM hay Langflow.
      - DATABASE_URL=${LANGFUSE_DATABASE_URL:?set LANGFUSE_DATABASE_URL in .env, e.g. postgresql://user:pass@<postgres-host>:5432/langfuse}
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env, e.g. output of openssl rand -base64 32}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env, e.g. output of openssl rand -hex 32}
      - TELEMETRY_ENABLED=false
      # ClickHouse server có sẵn, ví dụ 192.168.1.70.
      - CLICKHOUSE_MIGRATION_URL=${CLICKHOUSE_MIGRATION_URL:?set CLICKHOUSE_MIGRATION_URL in .env, e.g. clickhouse://<clickhouse-host>:9000}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:?set CLICKHOUSE_URL in .env, e.g. http://<clickhouse-host>:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      # Database riêng trên ClickHouse (server chung), không dùng "default"
      # để không đụng bảng của app khác. Tạo trước 1 lần trên server đó:
      #   CREATE DATABASE IF NOT EXISTS langfuse;
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-langfuse}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      # MinIO/S3 server có sẵn — bucket phải tạo trước (mặc định "langfuse").
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_BUCKET:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=${LANGFUSE_S3_REGION:-auto}
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env, e.g. http://<minio-host>:9000}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      # Redis server có sẵn.
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:?set REDIS_CONNECTION_STRING in .env, e.g. redis://:<password>@<redis-host>:6379}
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: mirai-langfuse-web
    depends_on:
      - langfuse-worker
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL:?set LANGFUSE_DATABASE_URL in .env, e.g. postgresql://user:pass@<postgres-host>:5432/langfuse}
      - SALT=${LANGFUSE_SALT:?set LANGFUSE_SALT in .env, e.g. output of openssl rand -base64 32}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env, e.g. output of openssl rand -hex 32}
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_MIGRATION_URL=${CLICKHOUSE_MIGRATION_URL:?set CLICKHOUSE_MIGRATION_URL in .env, e.g. clickhouse://<clickhouse-host>:9000}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:?set CLICKHOUSE_URL in .env, e.g. http://<clickhouse-host>:8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-langfuse}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_BUCKET:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=${LANGFUSE_S3_REGION:-auto}
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env, e.g. http://<minio-host>:9000}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:?set REDIS_CONNECTION_STRING in .env, e.g. redis://:<password>@<redis-host>:6379}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env, e.g. output of openssl rand -base64 32}
    restart: unless-stopped
