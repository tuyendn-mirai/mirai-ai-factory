# Routes argocd.mirai.local to the ArgoCD server through the shared
# ingress-nginx controller (see infra/ingress/ingress-nginx-values.yaml).
# Apply with `kubectl apply`. ArgoCD itself has no Helm values (installed
# from install.yaml in this same folder, not a chart) so this can't move
# into a chart's own `ingress.enabled` the way infra/apps/<name>/ apps can
# — see infra/apps/litellm/values.yaml for that pattern instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # argocd-server terminates TLS itself (self-signed by default); let nginx
    # re-encrypt to it rather than forcing --insecure on the server.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.mirai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https
