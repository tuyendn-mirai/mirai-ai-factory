# Per-APP Ingress: routes litellm.mirai.local to the LiteLLM proxy service
# through the shared ingress-nginx controller (see ingress-nginx-values.yaml).
# Apply with `kubectl apply`, same pattern as argocd-ingress.yaml.
#
# Không giống argocd-server, service litellm phục vụ HTTP thuần (chart
# litellm-helm không tự bật TLS) — không cần annotation backend-protocol.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.mirai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
