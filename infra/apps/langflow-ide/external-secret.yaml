# Dùng CHUNG cho cả langflow-ide và ../langflow-runtime/ — cả 2 chart cùng
# namespace "langflow", cùng trỏ vào Postgres "langflow" nên gộp 1
# ExternalSecret/1 Secret k8s ("langflow-credentials") thay vì 2 bản trùng
# lặp. Kéo giá trị từ secret LocalStack "mirai/langflow" (xem
# ../../../localstack/README.md). Áp dụng bằng `kubectl apply` thường —
# không qua ArgoCD, cùng lý do như ../external-secrets/clustersecretstore.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langflow-credentials
  namespace: langflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: langflow-credentials
  data:
    # langflow-ide: externalDatabase.password (field rời host/port/user/...)
    - secretKey: db-password
      remoteRef:
        key: mirai/langflow
        property: DB_PASSWORD
    # langflow-runtime: LANGFLOW_DATABASE_URL (chuỗi đầy đủ, chart đó không
    # có field rời để ghép — xem ../langflow-runtime/README.md)
    - secretKey: database-url
      remoteRef:
        key: mirai/langflow
        property: LANGFLOW_DATABASE_URL
