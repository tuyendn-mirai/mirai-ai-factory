# ConfigMap chứa source Custom Component Python (custom_components/*.py) để
# mount vào backend langflow-ide qua LANGFLOW_COMPONENTS_PATH, cho các
# component LiteLLM Speech to Text / Speech to Text (from URL) / Text to
# Speech / Echo Delay Tool tự xuất hiện trong sidebar thay vì phải
# copy-paste tay vào node Custom Component mỗi flow. Xem custom_components/README.md.
#
# Áp dụng bằng `kubectl apply` thường, không qua ArgoCD — cùng lý do như
# external-secret.yaml/pvc-shared-data.yaml trong thư mục này: app-of-apps
# chỉ quét application.yaml, không quản lý resource thường khác.
#
# Đổi nội dung file .py bên dưới KHÔNG tự làm pod restart (ConfigMap không
# có checksum annotation nào trên backend-statefulset) — cùng gotcha đã gặp
# ở litellm proxy_config, xem ../litellm/README.md. Sau khi sửa, phải
# `kubectl apply` lại file này RỒI `kubectl rollout restart statefulset/langflow-service -n langflow`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langflow-custom-components
  namespace: langflow
data:
  litellm_speech_to_text.py: |
    import mimetypes
    from pathlib import Path

    import httpx

    from langflow.custom import Component
    from langflow.io import FileInput, MessageTextInput, Output, SecretStrInput
    from langflow.schema.message import Message


    class LiteLLMSpeechToText(Component):
        display_name = "LiteLLM Speech to Text"
        description = (
            "Transcribe audio via LiteLLM's OpenAI-compatible /v1/audio/transcriptions "
            "endpoint (Tang 3), proxied to whisperx-tiny on LocalAI (Tang 2)."
        )
        icon = "mic"
        name = "LiteLLMSpeechToText"

        inputs = [
            FileInput(
                name="audio_file",
                display_name="Audio File",
                file_types=["wav", "mp3", "m4a", "flac", "ogg"],
                required=True,
            ),
            MessageTextInput(
                name="base_url",
                display_name="LiteLLM Base URL",
                value="http://litellm.litellm.svc.cluster.local:4000",
                info="No trailing slash, no /v1 suffix - it is appended below.",
            ),
            SecretStrInput(
                name="api_key",
                display_name="LiteLLM Master Key",
                required=True,
                info="Same value as LITELLM_MASTER_KEY / PROXY_MASTER_KEY.",
            ),
            MessageTextInput(
                name="model",
                display_name="Model",
                value="whisperx-tiny",
            ),
        ]

        outputs = [
            Output(display_name="Transcript", name="transcript", method="transcribe"),
        ]

        def transcribe(self) -> Message:
            url = f"{self.base_url.rstrip('/')}/v1/audio/transcriptions"
            path = Path(self.audio_file)
            content_type = mimetypes.guess_type(path.name)[0] or "application/octet-stream"

            with path.open("rb") as f:
                response = httpx.post(
                    url,
                    headers={"Authorization": f"Bearer {self.api_key}"},
                    data={"model": self.model},
                    files={"file": (path.name, f, content_type)},
                    timeout=120,
                )
            response.raise_for_status()
            text = response.json()["text"]

            message = Message(text=text)
            self.status = message
            return message
  litellm_speech_to_text_url.py: |
    import mimetypes

    import httpx

    from langflow.custom import Component
    from langflow.io import MessageTextInput, Output, SecretStrInput
    from langflow.schema.message import Message


    class LiteLLMSpeechToTextFromURL(Component):
        display_name = "LiteLLM Speech to Text (from URL)"
        description = (
            "Fetch audio from a URL (e.g. a presigned S3/MinIO GET URL) and "
            "transcribe it via LiteLLM's OpenAI-compatible /v1/audio/transcriptions "
            "endpoint (Tang 3), proxied to whisperx-tiny on LocalAI (Tang 2). "
            "MCP tool callers can only pass plain strings, not upload a file - "
            "this is the URL-based sibling of LiteLLMSpeechToText's FileInput, "
            "meant for flows exposed as MCP tools rather than used in Playground."
        )
        icon = "mic"
        name = "LiteLLMSpeechToTextFromURL"

        inputs = [
            MessageTextInput(
                name="audio_url",
                display_name="Audio URL",
                required=True,
                info="Any URL Langflow's backend pod can reach with a plain GET (presigned S3/MinIO URLs work).",
            ),
            MessageTextInput(
                name="base_url",
                display_name="LiteLLM Base URL",
                value="http://litellm.litellm.svc.cluster.local:4000",
                info="No trailing slash, no /v1 suffix - it is appended below.",
            ),
            SecretStrInput(
                name="api_key",
                display_name="LiteLLM Master Key",
                required=True,
                info="Same value as LITELLM_MASTER_KEY / PROXY_MASTER_KEY.",
            ),
            MessageTextInput(
                name="model",
                display_name="Model",
                value="whisperx-tiny",
            ),
        ]

        outputs = [
            Output(display_name="Transcript", name="transcript", method="transcribe"),
        ]

        async def transcribe(self) -> Message:
            async with httpx.AsyncClient(timeout=120) as client:
                audio_resp = await client.get(self.audio_url)
                audio_resp.raise_for_status()

                file_name = self.audio_url.split("?")[0].rsplit("/", 1)[-1] or "audio"
                content_type = (
                    audio_resp.headers.get("content-type")
                    or mimetypes.guess_type(file_name)[0]
                    or "application/octet-stream"
                )

                response = await client.post(
                    f"{self.base_url.rstrip('/')}/v1/audio/transcriptions",
                    headers={"Authorization": f"Bearer {self.api_key}"},
                    data={"model": self.model},
                    files={"file": (file_name, audio_resp.content, content_type)},
                )
            response.raise_for_status()
            text = response.json()["text"]

            message = Message(text=text)
            self.status = message
            return message
  litellm_text_to_speech.py: |
    import uuid

    import httpx

    from langflow.custom import Component
    from langflow.io import MessageTextInput, Output, SecretStrInput
    from langflow.schema.message import Message
    from langflow.services.deps import get_storage_service


    class LiteLLMTextToSpeech(Component):
        display_name = "LiteLLM Text to Speech"
        description = (
            "Synthesize speech via LiteLLM's OpenAI-compatible /v1/audio/speech "
            "endpoint (Tang 3), proxied to vits-ljs-sherpa on LocalAI (Tang 2)."
        )
        icon = "speaker"
        name = "LiteLLMTextToSpeech"

        inputs = [
            MessageTextInput(
                name="input_text",
                display_name="Text",
                required=True,
            ),
            MessageTextInput(
                name="base_url",
                display_name="LiteLLM Base URL",
                value="http://litellm.litellm.svc.cluster.local:4000",
                info="No trailing slash, no /v1 suffix - it is appended below.",
            ),
            SecretStrInput(
                name="api_key",
                display_name="LiteLLM Master Key",
                required=True,
                info="Same value as LITELLM_MASTER_KEY / PROXY_MASTER_KEY.",
            ),
            MessageTextInput(
                name="model",
                display_name="Model",
                value="vits-ljs-sherpa",
            ),
            MessageTextInput(
                name="voice",
                display_name="Voice",
                value="default",
                info=(
                    "Required field on LiteLLM's /v1/audio/speech even for "
                    "single-voice models - vits-ljs-sherpa ignores the value."
                ),
            ),
            MessageTextInput(
                name="public_base_url",
                display_name="Public Base URL",
                value="http://langflow.mirai.local",
                info=(
                    "Browser/external-reachable Langflow origin, used ONLY for the "
                    "download link text (Ingress host) - unrelated to base_url "
                    "above (in-cluster LiteLLM address). A caller outside the "
                    "cluster (e.g. mirai-hub-web) can't resolve a bare relative "
                    "path or the internal Service DNS."
                ),
            ),
        ]

        outputs = [
            Output(display_name="Audio Message", name="audio", method="synthesize"),
        ]

        async def synthesize(self) -> Message:
            url = f"{self.base_url.rstrip('/')}/v1/audio/speech"
            async with httpx.AsyncClient(timeout=120) as client:
                response = await client.post(
                    url,
                    headers={"Authorization": f"Bearer {self.api_key}"},
                    json={"model": self.model, "input": self.input_text, "voice": self.voice},
                )
            response.raise_for_status()

            # LiteLLM's response Content-Type for this endpoint is not trustworthy:
            # verified live that vits-ljs-sherpa (sherpa-onnx backend on LocalAI)
            # returns real RIFF/WAVE bytes while LiteLLM's header still claims
            # "audio/mpeg". Saving it as .mp3 anyway (trusting the header) mislabels
            # the file - naming it by its actual container format matters once
            # something downstream infers Content-Type from the extension (see
            # mirai-hub-api's app/routers/files.py get_tool_audio, which proxies
            # this file back to a browser with a real audio/* type).
            file_name = f"{uuid.uuid4().hex}.wav" if response.content[:4] == b"RIFF" else f"{uuid.uuid4().hex}.mp3"

            # Same convention Langflow itself uses for uploaded files
            # (flow_id/file_name), served back through the Files API.
            flow_id = str(getattr(getattr(self, "graph", None), "flow_id", None) or "misc")

            storage_service = get_storage_service()
            await storage_service.save_file(flow_id=flow_id, file_name=file_name, data=response.content)

            # NOT Message(files=[...]): Langflow 1.12.0's ChatOutputResponse file
            # validator (lfx/utils/schemas.py) only recognizes extensions in
            # TEXT_FILE_TYPES/IMG_FILE_TYPES - "mp3" matches neither, so it raises
            # "File type is required" and drops the whole chat event (Playground
            # shows text only, no crash visible to the user). A plain download
            # link sidesteps that validator entirely; the Files API endpoint also
            # always sends Content-Disposition: attachment, so this is a download
            # link, not an inline player, regardless of how it's delivered.
            download_url = f"{self.public_base_url.rstrip('/')}/api/v1/files/download/{flow_id}/{file_name}"
            message = Message(text=f"{self.input_text}\n\n[Download audio]({download_url})")
            self.status = message
            return message
  echo_delay_tool.py: |
    import asyncio
    from datetime import datetime, timezone

    from langflow.custom import Component
    from langflow.io import IntInput, MessageTextInput, Output
    from langflow.schema.message import Message


    class EchoDelayTool(Component):
        display_name = "Echo Delay Tool"
        description = (
            "Test-only tool: sleeps for delay_seconds, then echoes label back with "
            "start/end timestamps. Call it more than once in the same turn (same "
            "label or different) to check whether the caller actually runs "
            "multiple MCP tool calls concurrently or one at a time - if two calls "
            "both sleep 5s and the total wall-clock time is ~10s, they ran "
            "sequentially; if ~5s, they ran in parallel."
        )
        icon = "clock"
        name = "EchoDelayTool"

        inputs = [
            MessageTextInput(
                name="label",
                display_name="Label",
                required=True,
                info="Any string to tell this call's result apart from another parallel call.",
            ),
            IntInput(
                name="delay_seconds",
                display_name="Delay Seconds",
                value=5,
                info="How long to sleep before responding, in seconds.",
            ),
        ]

        outputs = [
            Output(display_name="Result", name="result", method="run"),
        ]

        async def run(self) -> Message:
            start = datetime.now(timezone.utc)
            await asyncio.sleep(self.delay_seconds)
            end = datetime.now(timezone.utc)

            text = (
                f"[{self.label}] started={start.strftime('%H:%M:%S.%f')[:-3]} "
                f"ended={end.strftime('%H:%M:%S.%f')[:-3]} delay={self.delay_seconds}s"
            )
            message = Message(text=text)
            self.status = message
            return message
