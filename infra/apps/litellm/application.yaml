# ArgoCD Application for LiteLLM (Tầng 3), following the infra/apps/<name>/
# convention: values.yaml is a real file in this repo (cloned from the
# chart's defaults), referenced here via a second "values" source.
#
# Chart mặc định là OCI (oci://ghcr.io/berriai/litellm-helm) — ArgoCD khai
# báo OCI Helm chart bằng repoURL KHÔNG có tiền tố "oci://", còn "chart" là
# path/tên chart trong registry đó.
#
# Chưa Healthy ngay sau khi apply: Deployment cần 2 Secret chưa tồn tại
# (litellm-db-credentials, litellm-env-secrets) — do external-secret.yaml
# (cùng thư mục này) tạo, xem README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      targetRevision: "0.1.100"
      helm:
        valueFiles:
          - $values/infra/apps/litellm/values.yaml
    - repoURL: git@github.com:tuyendn-mirai/mirai-ai-factory.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Mặc định ignoreDifferences chỉ ảnh hưởng tính Sync Status, KHÔNG áp
      # dụng lúc sync thật (đã tự kiểm chứng: sync do thay đổi khác — sửa
      # masterkey — đã ghi đè lại field bị ignore, phải patch tay lại lần
      # nữa). RespectIgnoreDifferences=true bắt ArgoCD splice giá trị LIVE
      # vào manifest desired TRƯỚC khi áp dụng, giữ được field bị ignore qua
      # mọi lần sync — không chỉ lúc đầu tạo resource.
      - RespectIgnoreDifferences=true
  # Bug của chart litellm-helm (mọi version tính đến 0.1.100): initContainer
  # "db-ready" hard-code image docker.io/bitnami/postgresql:16.1.0-debian-11-r20
  # thẳng trong template, KHÔNG đọc values.image.dbReadyImage/dbReadyTag (2
  # field đó tồn tại trong values.yaml nhưng chart không dùng tới). Tag đó đã
  # bị Bitnami gỡ khỏi Docker Hub (confirm bằng `docker pull` thật) — không
  # sửa được qua values.yaml. Đã kubectl patch sang docker.io/postgres:16-alpine
  # (có sẵn psql, không bị Bitnami xoá tag) — ignore field này để selfHeal
  # không ghi đè lại image gốc đã hỏng mỗi lần reconcile.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: litellm
      jsonPointers:
        - /spec/template/spec/initContainers/0/image
