# Default values for litellm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Use "ghcr.io/berriai/litellm-database" for optimized image with database
  repository: ghcr.io/berriai/litellm-database
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "main-latest"
  tag: ""

  # Image and tag used for the init container to check and wait for the
  #  readiness of the postgres database.
  dbReadyImage: docker.io/bitnami/postgresql
  dbReadyTag: ""

imagePullSecrets: []
nameOverride: "litellm"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# At the time of writing, the litellm docker image requires write access to the
#  filesystem on startup so that prisma can install some dependencies.
podSecurityContext: {}
securityContext: {}
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: false
  # runAsNonRoot: true
  # runAsUser: 1000

# A list of Kubernetes Secret objects that will be exported to the LiteLLM proxy
#  pod as environment variables.  These secrets can then be referenced in the
#  configuration file (or "litellm" ConfigMap) with `os.environ/<Env Var Name>`
#
# litellm-env-secrets: tạo bởi ExternalSecret (xem external-secret.yaml
# trong cùng thư mục này), chứa REDIS_HOST/REDIS_PORT/REDIS_PASSWORD/
# REDIS_DB. Chart này không có chỗ nào khác để bơm các biến đó khi
# redis.enabled=false (dùng Redis ngoài thay vì subchart), nên phải đi qua
# envFrom dù REDIS_HOST/REDIS_PORT không thực sự là secret.
environmentSecrets:
  - litellm-env-secrets

service:
  type: ClusterIP
  port: 4000

# Trước dùng file riêng infra/ingress/litellm-ingress.yaml (kubectl apply
# thủ công, theo convention cũ "mỗi app 1 file trong infra/ingress/"). Bỏ
# convention đó — chart này tự hỗ trợ ingress.enabled nên để ArgoCD quản lý
# luôn, không cần file/kubectl apply tách rời nữa. ssl-redirect: "false" vì
# service phục vụ HTTP thuần (không như argocd-server tự serve TLS).
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: litellm.mirai.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Chart tự tạo Secret <release>-masterkey trực tiếp từ giá trị này (xem
# templates/secret-masterkey.yaml) — KHÔNG có field nào để trỏ ra Secret có
# sẵn do ExternalSecret quản lý (khác với db.secret.name bên dưới, cái đó có
# hỗ trợ). Để trống thì chart tự random 1 giá trị MỚI mỗi lần `helm
# template` chạy lại — ArgoCD selfHeal sẽ liên tục apply lại, đổi master key
# ngẫu nhiên. Quyết định: chấp nhận plaintext ở đây cho POC local (giống rủi
# ro đang có sẵn với .env gốc repo đã bị commit) — xem lại
# khi lên EKS thật.
masterkey: "Adgjmptw1"

# The elements within proxy_config are rendered as config.yaml for the proxy
#  Examples: https://github.com/BerriAI/litellm/tree/main/litellm/proxy/example_config_yaml
#  Reference: https://docs.litellm.ai/docs/proxy/configs
#
# Port từ layer3-litellm/config.yaml (bản docker-compose) — KHÔNG sửa file
# đó, vì hai nơi dùng tên biến môi trường khác nhau cho cùng 1 giá trị
# (docker-compose set LITELLM_MASTER_KEY; chart này luôn set PROXY_MASTER_KEY
# — xem field `masterkey` phía trên).
#
# api_base trỏ thẳng literal string thay vì os.environ/OLLAMA_BASE_URL: đây
# là config thường (không phải secret), và chart không có chỗ nào bơm biến
# môi trường tuỳ ý ngoài environmentSecrets/db/redis — không đáng để nhét
# một giá trị không nhạy cảm vào Secret chỉ để đi vòng qua giới hạn đó.
proxy_config:
  model_list:
    - model_name: gemma4:e4b
      litellm_params:
        model: ollama/gemma4:e4b
        api_base: "http://host.k3d.internal:11434"
      model_info:
        nguon_cung: ollama-local
        hinh_thuc_trien_khai: on-premise
        status: active

    - model_name: gemma4:31b
      litellm_params:
        model: ollama/gemma4:31b
        api_base: "http://host.k3d.internal:11434"
      model_info:
        nguon_cung: ollama-local
        hinh_thuc_trien_khai: on-premise
        status: active

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

  litellm_settings:
    # requires cache: true — xem comment trên block `redis:` bên dưới.
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      db: os.environ/REDIS_DB
      namespace: "litellm.cache"

    # Langfuse đã deploy vào mirai-eks (../langfuse/) — LANGFUSE_PUBLIC_KEY/
    # LANGFUSE_SECRET_KEY/LANGFUSE_HOST bơm qua environmentSecrets (biến
    # LANGFUSE_HOST trỏ service nội bộ cluster
    # http://langfuse-web.langfuse.svc.cluster.local:3000, không cần
    # host.k3d.internal vì Langfuse giờ chạy TRONG cluster, không phải
    # container ngoài như Postgres/Redis). litellm/langfuse SDK tự đọc 3
    # biến môi trường này khi success_callback/failure_callback bật —
    # không cần field riêng nào trong config.yaml.
    success_callback: ["langfuse"]
    failure_callback: ["langfuse"]

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

db:
  # Postgres chạy sẵn qua docker-compose ở gốc repo (trên máy host cụm k3d
  # này) — không dùng subchart postgresql (Chart.yaml gate subchart này bằng
  # "condition: db.deployStandalone", nên tắt deployStandalone cũng tắt
  # luôn subchart).
  useExisting: true

  # ai_factory là DB dùng chung nhiều app, mỗi app 1 schema riêng (xem .env
  # gốc repo) — "?schema=litellm" là cú pháp Prisma connection string bình
  # thường, ghép thẳng vào đây vì DATABASE_URL của chart chỉ nối chuỗi
  # "postgresql://user:pass@endpoint/database" (xem templates/deployment.yaml).
  #
  # host.k3d.internal thay vì IP LAN tĩnh (172.16.0.191, DHCP trên
  # enp5s0 — có thể đổi): Postgres này thực chất là container docker-compose
  # CHẠY NGAY TRÊN máy đang host cụm k3d này (không phải server khác), nên
  # dùng đúng hostname k3d tự tạo trỏ về gateway của host — cùng pattern
  # LocalStack (xem ../../../localstack/README.md). Đã verify bằng `psql`
  # thật từ 1 pod trong cluster trước khi đổi.
  endpoint: "host.k3d.internal:5435"
  database: "ai_factory?schema=litellm"
  secret:
    # litellm-db-credentials: tạo bởi ExternalSecret (xem external-secret.yaml
    # trong cùng thư mục này), với 2 key username/password đúng tên bên dưới.
    name: litellm-db-credentials
    usernameKey: username
    passwordKey: password

  # Use the Stackgres Helm chart to deploy an instance of a Stackgres cluster.
  #  The Stackgres Operator must already be installed within the target
  #  Kubernetes cluster.
  # TODO: Stackgres deployment currently unsupported
  useStackgresOperator: false

  # Use the Postgres Helm chart to create a single node, stand alone postgres
  #  instance.  See the "postgresql" top level key for additional configuration.
  deployStandalone: false

# Settings for Bitnami postgresql chart (if db.deployStandalone is true, ignored
#  otherwise)
postgresql:
  architecture: standalone
  auth:
    username: litellm
    database: litellm

    # You should override these on the helm command line with
    #  `--set postgresql.auth.postgres-password=<some good password>,postgresql.auth.password=<some good password>`
    password: NoTaGrEaTpAsSwOrD
    postgres-password: NoTaGrEaTpAsSwOrD

    # A secret is created by this chart (litellm-helm) with the credentials that
    #  the new Postgres instance should use.
    # existingSecret: ""
    # secretKeys:
    #   userPasswordKey: password

# requires cache: true in config file
# either enable this or pass a secret for REDIS_HOST, REDIS_PORT, REDIS_PASSWORD or REDIS_URL
# with cache: true to use existing redis instance
redis:
  enabled: false
  architecture: standalone

