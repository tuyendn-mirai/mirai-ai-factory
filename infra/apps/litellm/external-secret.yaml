# 2 ExternalSecret kéo giá trị từ 1 secret LocalStack "mirai/litellm" (xem
# ../../../localstack/README.md) thành 2 Secret k8s riêng, đúng tên
# Secret/key mà infra/apps/litellm/values.yaml tham chiếu
# (db.secret.name, environmentSecrets). Áp dụng bằng `kubectl apply` thường
# — cùng lý do như ../external-secrets/clustersecretstore.yaml, không qua ArgoCD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: litellm-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: mirai/litellm
        property: username
    - secretKey: password
      remoteRef:
        key: mirai/litellm
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: litellm-env-secrets
  data:
    - secretKey: REDIS_HOST
      remoteRef:
        key: mirai/litellm
        property: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: mirai/litellm
        property: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: mirai/litellm
        property: REDIS_PASSWORD
    - secretKey: REDIS_DB
      remoteRef:
        key: mirai/litellm
        property: REDIS_DB
    # LANGFUSE_HOST không phải secret thật (chỉ là DNS nội bộ cluster) —
    # nhét qua đây vì chart litellm-helm không có cách nào khác bơm biến môi
    # trường tuỳ ý ngoài environmentSecrets/db/redis (cùng lý do REDIS_HOST/
    # REDIS_PORT ở trên, xem infra/apps/litellm/README.md).
    - secretKey: LANGFUSE_HOST
      remoteRef:
        key: mirai/litellm
        property: LANGFUSE_HOST
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: mirai/litellm
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: mirai/litellm
        property: LANGFUSE_SECRET_KEY
