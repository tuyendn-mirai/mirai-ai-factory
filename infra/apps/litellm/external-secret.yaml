# 2 ExternalSecret kéo giá trị từ 1 secret LocalStack "mirai/litellm" (xem
# docs/INFRA_K3D_EKS.md mục LocalStack) thành 2 Secret k8s riêng, đúng tên
# Secret/key mà infra/apps/litellm/values.yaml tham chiếu
# (db.secret.name, environmentSecrets). Áp dụng bằng `kubectl apply` thường
# — cùng lý do như clustersecretstore-localstack.yaml, không qua ArgoCD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: litellm-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: mirai/litellm
        property: username
    - secretKey: password
      remoteRef:
        key: mirai/litellm
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: litellm-env-secrets
  data:
    - secretKey: REDIS_HOST
      remoteRef:
        key: mirai/litellm
        property: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: mirai/litellm
        property: REDIS_PORT
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: mirai/litellm
        property: REDIS_PASSWORD
    - secretKey: REDIS_DB
      remoteRef:
        key: mirai/litellm
        property: REDIS_DB
