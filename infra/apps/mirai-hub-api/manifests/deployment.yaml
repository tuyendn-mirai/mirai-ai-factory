apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirai-hub-api
  namespace: mirai-hub
  labels:
    app.kubernetes.io/name: mirai-hub-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mirai-hub-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirai-hub-api
    spec:
      containers:
        - name: mirai-hub-api
          # Không qua registry — build local rồi `k3d image import` thẳng
          # vào containerd của cluster (xem README.md), nên bắt buộc
          # IfNotPresent để kubelet không cố pull từ registry không tồn tại.
          image: mirai-hub-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Same underlying secret value as the old Chainlit build's
            # CHAINLIT_AUTH_SECRET — only the env var name the app reads
            # changed (app/settings.py's `jwt_secret`), so the ExternalSecret
            # key name below is intentionally left as-is.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: chainlit-auth-secret
            - name: DEV_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: dev-admin-password
            # Official Chainlit data layer — Postgres. Schema riêng trong DB
            # "ai_factory" dùng chung với litellm/langfuse (xem
            # mirai_hub/data_layer.py — search_path, không phải "?schema="
            # trong URL như langfuse dùng, asyncpg không hiểu trick đó).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: database-url
            - name: DATABASE_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: database-schema
            # Official Chainlit data layer — S3-compatible storage (MinIO).
            - name: BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: bucket-name
            - name: APP_AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: app-aws-access-key
            - name: APP_AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: app-aws-secret-key
            - name: APP_AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: app-aws-region
            # Unset against real AWS — only meaningful for the local MinIO
            # instance, so optional:true.
            - name: DEV_AWS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: dev-aws-endpoint
                  optional: true
            # Layer 3 — LiteLLM (OpenAI-compatible), the chat model backend
            # for the tool-calling loop (mirai_hub/chat.py). Service DNS nội
            # bộ k8s, không phải secret.
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: litellm-api-key
            # Layer 4 — langflow-runtime, service DNS nội bộ k8s. Nguồn cho
            # màn hình chọn MCP server (mirai_hub/langflow_client.py).
            - name: LANGFLOW_RUNTIME_BASE_URL
              value: http://langflow-runtime.langflow.svc.cluster.local:7860
            - name: LANGFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: langflow-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
