# Kéo giá trị từ secret LocalStack "mirai/langfuse" (xem
# ../../../localstack/README.md) thành 1 Secret k8s "langfuse-credentials"
# — key đích (secretKey) đặt theo tên field values.yaml của chart mong đợi
# (postgres-password, redis-password, clickhouse-password, s3-access-key-id,
# s3-secret-access-key, salt, encryption-key, nextauth-secret), không nhất
# thiết trùng tên field trong LocalStack (remoteRef.property) — ExternalSecret
# map độc lập 2 bên. Áp dụng bằng `kubectl apply` thường — cùng lý do như
# ../external-secrets/clustersecretstore.yaml, không qua ArgoCD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-credentials
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: langfuse-credentials
  data:
    - secretKey: postgres-password
      remoteRef:
        key: mirai/langfuse
        property: DB_PASSWORD
    - secretKey: redis-password
      remoteRef:
        key: mirai/langfuse
        property: REDIS_PASSWORD
    - secretKey: clickhouse-password
      remoteRef:
        key: mirai/langfuse
        property: CLICKHOUSE_PASSWORD
    - secretKey: s3-access-key-id
      remoteRef:
        key: mirai/langfuse
        property: MINIO_ROOT_USER
    - secretKey: s3-secret-access-key
      remoteRef:
        key: mirai/langfuse
        property: MINIO_ROOT_PASSWORD
    - secretKey: salt
      remoteRef:
        key: mirai/langfuse
        property: LANGFUSE_SALT
    - secretKey: encryption-key
      remoteRef:
        key: mirai/langfuse
        property: LANGFUSE_ENCRYPTION_KEY
    - secretKey: nextauth-secret
      remoteRef:
        key: mirai/langfuse
        property: NEXTAUTH_SECRET
