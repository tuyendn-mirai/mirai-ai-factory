# ClusterSecretStore dùng chung cho MỌI ExternalSecret trong cluster trỏ vào
# LocalStack (không riêng app nào — đặt cạnh external-secrets vì đây là
# operator sở hữu resource này). Áp dụng bằng `kubectl apply` thường, KHÔNG
# qua ArgoCD Application/Helm — xem README.md trong cùng thư mục này.
#
# CRD không có field "endpoint" trong spec.provider.aws (đã kiểm tra bằng
# `kubectl explain clustersecretstore.spec.provider.aws` — không có). Trỏ
# LocalStack qua biến môi trường controller-level AWS_SECRETSMANAGER_ENDPOINT
# + AWS_STS_ENDPOINT (xem infra/apps/external-secrets/values.yaml, field
# extraEnv) — ảnh hưởng TẤT CẢ ClusterSecretStore/SecretStore trong cluster,
# không set riêng per-store được.
#
# auth.jwt (kiểu IRSA) thay cho static access key/secret key trước đây —
# không còn credential tĩnh nào (không có Secret bootstrap gà-trứng như
# repo-credential của ArgoCD nữa, vì auth.jwt tự mint token cho
# ServiceAccount qua TokenRequest API — RBAC "serviceaccounts/token: create"
# đã có sẵn trong ClusterRole external-secrets-controller, không cần thêm).
# ServiceAccount tham chiếu là chính ServiceAccount có sẵn của controller
# (external-secrets/external-secrets), không tạo SA riêng — role thật lấy
# từ annotation "eks.amazonaws.com/role-arn" trên chính SA đó (xem
# infra/apps/external-secrets/values.yaml, field serviceAccount.annotations),
# KHÔNG phải qua field `role` dưới đây (đã tự gặp lỗi: set thêm `role` cùng
# giá trị role đã lấy qua JWT khiến code cố AssumeRole thêm 1 lần nữa LÊN
# CHÍNH role đó — 403 vì role không có trust policy cho chính nó. `role`
# field chỉ dùng khi cần chain sang role KHÁC sau khi đã có credential gốc).
#
# QUAN TRỌNG: LocalStack KHÔNG verify chữ ký JWT/issuer/role tồn tại lúc
# AssumeRoleWithWebIdentity (đã tự test bằng JWT giả + role không tồn tại,
# vẫn nhận credential) — auth.jwt ở đây chỉ tập dượt đúng SHAPE cấu hình
# IRSA thật để chuyển sang EKS gần như nguyên xi, KHÔNG phải test
# enforcement/bảo mật thật. Role/trust policy/OIDC provider tạo bằng
# ../../../localstack/setup-oidc-iam.sh — xem README.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: localstack
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
