# ClusterSecretStore dùng chung cho MỌI ExternalSecret trong cluster trỏ vào
# LocalStack (không riêng app nào — đặt cạnh external-secrets vì đây là
# operator sở hữu resource này, giống pattern infra/ingress/*.yaml: áp dụng
# bằng `kubectl apply` thường, KHÔNG qua ArgoCD Application/Helm — xem
# docs/INFRA_K3D_EKS.md mục 6 phần "SecretStore/ClusterSecretStore".
#
# Secret access key/secret key ("test"/"test") không tạo qua ExternalSecret
# (gà-trứng: đây chính là credential để ExternalSecret gọi ra ngoài) — cùng
# lý do repo-credential secret ở mục 6 cũng tạo bằng kubectl tay.
apiVersion: v1
kind: Secret
metadata:
  name: localstack-aws-creds
  namespace: external-secrets
type: Opaque
stringData:
  access-key-id: test
  secret-access-key: test
---
# CRD không có field "endpoint" trong spec.provider.aws (đã kiểm tra bằng
# `kubectl explain clustersecretstore.spec.provider.aws` — không có). Trỏ
# LocalStack qua biến môi trường controller-level AWS_SECRETSMANAGER_ENDPOINT
# (xem infra/apps/external-secrets/values.yaml, field extraEnv) — ảnh hưởng
# TẤT CẢ ClusterSecretStore/SecretStore dùng service SecretsManager trong
# cluster, không set riêng per-store được.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: localstack
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: localstack-aws-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: localstack-aws-creds
            namespace: external-secrets
            key: secret-access-key
