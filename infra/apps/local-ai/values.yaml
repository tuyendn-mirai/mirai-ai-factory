# Cloned từ `helm show values go-skynet/local-ai --version 3.4.2`, chỉnh
# trực tiếp trong file này theo quy ước `infra/apps/<name>/`, xem
# ../README.md.

replicaCount: 1

deployment:
  image:
    repository: quay.io/go-skynet/local-ai
    # Không có GPU node trong cụm mirai-eks (k3d) — dùng tag CPU-only.
    tag: latest-cpu
  env:
    threads: 4
    context_size: 512
    # Backend gallery: whisperx KHÔNG bundle sẵn trong image local-ai (chỉ
    # core backends như llama.cpp/whisper.cpp/piper) — phải cài qua backend
    # gallery lúc boot, xem README.md#backend-gallery-whisperx.
    external_backends: "whisperx"
    # Mặc định BACKENDS_PATH nằm trên filesystem tạm của pod (không PVC nào
    # mount vào đó) — backend tải về (~vài trăm MB-GB, whisperx kèm
    # torch/ctranslate2) sẽ mất và phải tải lại mỗi lần pod restart. Trỏ vào
    # PVC persistence.models (đã mount /models) để cache qua các lần restart.
    backends_path: "/models/backends"

  # # Inject Secrets into Environment:
  # secretEnv:
  # - name: HF_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: some-secret
  #       key: hf-token

  modelsPath: "/models"
  prompt_templates:
    image: busybox
  pullPolicy: IfNotPresent
  imagePullSecrets: []

  ## Needed for GPU Nodes
  #runtimeClassName: gpu

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Model config to include
modelsConfigs:
  {}
  # phi-2: |
  #   name: phi-2
  #   context_size: 2048
  #   f16: true
  #   mmap: true
  #   trimsuffix:
  #   - "\n"
  #   parameters:
  #     model: phi-2.Q8_0.gguf
  #     temperature: 0.2
  #     top_k: 40
  #     top_p: 0.95
  #     seed: -1
  #   template:
  #     chat: &template |-
  #       Instruct: {{.Input}}
  #       Output:
  #     completion: *template

# Prompt templates to include
promptTemplates:
  {}
  # ggml-gpt4all-j.tmpl: |
  #   The prompt below is a question to answer, a task to complete, or a conversation to respond to; decide which and write an appropriate response.
  #   ### Prompt:
  #   {{.Input}}
  #   ### Response:

initContainers: []

sidecarContainers: []

# Persistent storage for models và generated output. Cụm mirai-eks (k3d) chỉ
# có storageClass local-path/gp2 (provisioner rancher.io/local-path), CHỈ hỗ
# trợ ReadWriteOnce — default chart là ReadWriteMany nên phải override, cùng
# lý do như infra/apps/langflow-ide/pvc-shared-data.yaml.
persistence:
  models:
    enabled: true
    annotations: {}
    storageClass: "local-path"
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    globalMount: /models
  output:
    enabled: true
    annotations: {}
    storageClass: "local-path"
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    globalMount: /tmp/generated

service:
  type: ClusterIP
  port: 80
  nodePort:
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: local-ai.mirai.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}

tolerations: []

affinity: {}
