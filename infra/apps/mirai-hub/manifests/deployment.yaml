apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirai-hub
  namespace: mirai-hub
  labels:
    app.kubernetes.io/name: mirai-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mirai-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirai-hub
    spec:
      containers:
        - name: mirai-hub
          # Không qua registry — build local rồi `k3d image import` thẳng
          # vào containerd của cluster (xem README.md), nên bắt buộc
          # IfNotPresent để kubelet không cố pull từ registry không tồn tại.
          image: mirai-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Layer 4 — service DNS nội bộ k8s (namespace "langflow", release
            # "langflow-runtime", xem infra/apps/langflow-runtime/values.yaml).
            - name: LANGFLOW_RUNTIME_BASE_URL
              value: http://langflow-runtime.langflow.svc.cluster.local:7860
            - name: CHAINLIT_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: chainlit-auth-secret
            # Chưa rõ langflow-runtime có bắt buộc API key không (chưa test
            # với flow thật) — để optional, key này chưa tồn tại trong
            # Secret (chưa seed, xem external-secret.yaml) nên optional:true
            # là bắt buộc, không chỉ là phòng hờ.
            - name: LANGFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: langflow-api-key
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: database-url
            # Schema riêng trong DB "ai_factory" dùng chung với litellm/
            # langfuse (xem mirai_hub/data_layer.py — search_path, không
            # phải "?schema=" trong URL như langfuse dùng, asyncpg không
            # hiểu trick đó).
            - name: DATABASE_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: database-schema
            # Có default cứng trong code (mirai_hub/auth.py) nên không seed
            # cũng chạy được — optional:true, chưa có key này trong Secret.
            - name: DEV_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: dev-admin-password
                  optional: true
            - name: DEV_ANALYST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: dev-analyst-password
                  optional: true
            # OAuth Keycloak — để trống/không set 4 biến này thì app tự bỏ
            # qua oauth_callback (xem mirai-hub/mirai_hub/auth.py), chỉ còn
            # dev password login. Bật thật khi Keycloak lên (PLATFORM.md ghi
            # "chưa deploy").
            - name: OAUTH_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: oauth-keycloak-client-id
                  optional: true
            - name: OAUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: oauth-keycloak-client-secret
                  optional: true
            - name: OAUTH_KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: oauth-keycloak-realm
                  optional: true
            - name: OAUTH_KEYCLOAK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: mirai-hub-credentials
                  key: oauth-keycloak-base-url
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
