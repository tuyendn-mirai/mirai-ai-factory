apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirai-hub
  namespace: mirai-hub
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: hub.mirai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mirai-hub
                port:
                  name: http
