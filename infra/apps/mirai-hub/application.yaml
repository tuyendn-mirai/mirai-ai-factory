# ArgoCD Application cho mirai-hub (Layer 5) — KHÔNG dùng Helm, vì đây là
# app tự viết (source code ở ../../../mirai-hub/), không có chart nào để
# clone values.yaml từ đó như các app khác trong infra/apps/. Source trỏ
# thẳng plain manifest trong manifests/ (Deployment/Service/Ingress).
#
# Chưa Healthy ngay sau khi apply — 2 lý do:
# 1. image trong manifests/deployment.yaml là placeholder, chưa có registry
#    local nào build/push thật (xem README.md checklist).
# 2. Secret "mirai-hub-credentials" do external-secret.yaml (cùng thư mục
#    này) tạo, chưa apply/chưa seed key "mirai/mirai-hub" trong LocalStack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mirai-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tuyendn-mirai/mirai-ai-factory.git
    targetRevision: main
    path: infra/apps/mirai-hub/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mirai-hub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
