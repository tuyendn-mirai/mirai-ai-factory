# Áp dụng bằng `kubectl apply` thường, không qua ArgoCD — cùng lý do như
# ../external-secrets/clustersecretstore.yaml (không phải kind Application,
# app-of-apps không tự quản được, xem ../../README.md TODO).
#
# Kéo giá trị từ secret LocalStack "mirai/mirai-hub" — đã seed đủ field bên
# dưới (xem ../../../localstack/seed-secrets.sh). CHỈ khai đúng field đã
# seed: property không tồn tại trong LocalStack làm ExternalSecret lỗi
# SecretSyncedError cho CẢ object, không phải lỗi cục bộ từng field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mirai-hub-credentials
  namespace: mirai-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: mirai-hub-credentials
  data:
    - secretKey: chainlit-auth-secret
      remoteRef:
        key: mirai/mirai-hub
        property: CHAINLIT_AUTH_SECRET
    - secretKey: database-url
      remoteRef:
        key: mirai/mirai-hub
        property: DATABASE_URL
    - secretKey: database-schema
      remoteRef:
        key: mirai/mirai-hub
        property: DATABASE_SCHEMA
    - secretKey: dev-admin-password
      remoteRef:
        key: mirai/mirai-hub
        property: DEV_ADMIN_PASSWORD
    # Dùng thật cho mirai_hub/langflow_client.py (header x-api-key khi liệt kê
    # project/lấy composer-url cho màn hình chọn MCP server), không còn là
    # field "chưa test" như bản cũ của app.
    - secretKey: langflow-api-key
      remoteRef:
        key: mirai/mirai-hub
        property: LANGFLOW_API_KEY
    # Official Chainlit data layer — S3-compatible storage (MinIO), xem
    # mirai_hub/data_layer.py.
    - secretKey: bucket-name
      remoteRef:
        key: mirai/mirai-hub
        property: BUCKET_NAME
    - secretKey: app-aws-access-key
      remoteRef:
        key: mirai/mirai-hub
        property: APP_AWS_ACCESS_KEY
    - secretKey: app-aws-secret-key
      remoteRef:
        key: mirai/mirai-hub
        property: APP_AWS_SECRET_KEY
    - secretKey: app-aws-region
      remoteRef:
        key: mirai/mirai-hub
        property: APP_AWS_REGION
    - secretKey: dev-aws-endpoint
      remoteRef:
        key: mirai/mirai-hub
        property: DEV_AWS_ENDPOINT
    # Tool-calling loop của app gọi LiteLLM (Tầng 3) trực tiếp — dùng lại
    # masterkey plaintext của litellm-helm (xem infra/apps/litellm/values.yaml),
    # không mint virtual key riêng cho đơn giản (POC local).
    - secretKey: litellm-api-key
      remoteRef:
        key: mirai/mirai-hub
        property: LITELLM_API_KEY
