# Áp dụng bằng `kubectl apply` thường, không qua ArgoCD — cùng lý do như
# ../external-secrets/clustersecretstore.yaml (không phải kind Application,
# app-of-apps không tự quản được, xem ../../README.md TODO).
#
# Kéo giá trị từ secret LocalStack "mirai/mirai-hub" — đã seed 4 field bên
# dưới (xem ../../../localstack/seed-secrets.sh). CHỈ khai đúng field đã
# seed: property không tồn tại trong LocalStack làm ExternalSecret lỗi
# SecretSyncedError cho CẢ object, không phải lỗi cục bộ từng field — nên
# LANGFLOW_API_KEY/DEV_ANALYST_PASSWORD/OAUTH_KEYCLOAK_* chưa có ở đây (chưa
# seed, xem comment trong seed-secrets.sh và manifests/deployment.yaml —
# Deployment đọc các field đó qua secretKeyRef.optional:true, nên không cần
# đổi gì ở Deployment khi thêm field vào đây sau này).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mirai-hub-credentials
  namespace: mirai-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack
    kind: ClusterSecretStore
  target:
    name: mirai-hub-credentials
  data:
    - secretKey: chainlit-auth-secret
      remoteRef:
        key: mirai/mirai-hub
        property: CHAINLIT_AUTH_SECRET
    - secretKey: database-url
      remoteRef:
        key: mirai/mirai-hub
        property: DATABASE_URL
    - secretKey: database-schema
      remoteRef:
        key: mirai/mirai-hub
        property: DATABASE_SCHEMA
    - secretKey: dev-admin-password
      remoteRef:
        key: mirai/mirai-hub
        property: DEV_ADMIN_PASSWORD
