# Tầng 3 — AI Model Catalog (Hub)
#
# Đây CHÍNH LÀ Registry: mỗi entry "model_name" là một `logical_model` mà
# Tầng 4 được phép gọi. `model_info` mang các nhãn phân loại (nguon_cung,
# hinh_thuc_trien_khai, fallback_logical_model, status) theo schema trong
# docs/ARCHITECTURE.md — không có FastAPI/registry tự viết nào ở giữa,
# LiteLLM Proxy chính là điểm export API thống nhất `POST /chat/completions`.
#
# Tầng 4 KHÔNG được biết vendor_model_id (dòng `litellm_params.model`) —
# chỉ được biết `model_name` (logical_model).
#
# Backend ở đây là Ollama đã dựng sẵn ở SERVER KHÁC (không chạy trong
# docker-compose này). Đặt OLLAMA_BASE_URL trong .env, ví dụ:
#   OLLAMA_BASE_URL=http://192.168.1.50:11434
# Không cần API key cho Ollama.

model_list:
  # Chỉ có 1 model vật lý (gemma4:e4b) trên Ollama server, nhưng vẫn khai
  # báo 2 logical_model nghiệp vụ khác nhau — đúng nguyên tắc: Tầng 4 gọi
  # theo tên nghiệp vụ, không quan tâm/không biết model thật đứng sau.
  # Sau này đổi model vật lý (hoặc trỏ 2 tên qua 2 model khác nhau) chỉ
  # sửa ở đây, Tầng 4 không cần biết.
  - model_name: fp-analysis-default
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      nguon_cung: ollama-local
      hinh_thuc_trien_khai: on-premise
      status: active

  - model_name: cr-summarizer-fast
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      nguon_cung: ollama-local
      hinh_thuc_trien_khai: on-premise
      status: active

  # Ví dụ thêm vendor có API key thật (bật khi cần) — chỉ cần thêm entry,
  # KHÔNG cần sửa/deploy lại gì ở Tầng 4:
  # - model_name: fp-analysis-openai
  #   litellm_params:
  #     model: gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     nguon_cung: openai
  #     hinh_thuc_trien_khai: on-demand
  #     status: beta
  #
  # - model_name: fp-analysis-bedrock
  #   litellm_params:
  #     model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  #     aws_region_name: os.environ/AWS_REGION_NAME
  #   model_info:
  #     nguon_cung: bedrock
  #     hinh_thuc_trien_khai: on-demand
  #     status: beta

# router_settings.fallbacks (bật khi có ≥2 model): thêm entry vào
# model_list, gắn model_info.fallback_logical_model, rồi khai báo hành vi
# thật ở đây, ví dụ:
# router_settings:
#   fallbacks:
#     - fp-analysis-default: ["fp-analysis-backup"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # DATABASE_URL (env, xem docker-compose.yml) bật audit log mọi request
  # (bảng LiteLLM_SpendLogs) phục vụ Control Tower — không cần code thêm.

litellm_settings:
  # Cache response qua Redis ngoài (cùng server với Langfuse, khác DB index
  # để không lẫn key — xem REDIS_DB trong .env). Request giống hệt nhau
  # (cùng logical_model + messages + temperature) sẽ không gọi lại Ollama.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    db: os.environ/REDIS_DB
    namespace: "litellm.cache"
