[project]
# List of environment variables to be provided by each user to use the app.
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Duration (in seconds) of the user session expiry
user_session_timeout = 1296000  # 15 days

# Enable third parties caching (e.g., LangChain cache)
cache = false

# Whether to persist user environment variables (API keys) to the database
persist_user_env = false

# Whether to mask user environment variables (API keys) in the UI with password type
mask_user_env = false

# Authorized origins
allow_origins = ["*"]

[features]
# Process and display HTML in messages. Security risk — keep disabled.
unsafe_allow_html = false

# Process and display mathematical expressions.
latex = false

# Enable rendering of user messages markdown
user_message_markdown = true

# Autoscroll new user messages at the top of the window
user_message_autoscroll = true

# Autoscroll new assistant messages
assistant_message_autoscroll = true

# Automatically tag threads with the current chat profile (unused — no chat profiles in this app)
auto_tag_thread = true

# Allow users to edit their own messages. Safe with this app's tool-calling loop:
# on_message rebuilds history from cl.chat_context.to_openai() every turn, which
# Chainlit already truncates correctly on edit (see mirai_hub/chat.py).
edit_message = true

# Single-tenant internal tool — no cross-user thread sharing.
allow_thread_sharing = false

# Enable favorite messages
favorites = false

[features.slack]
reaction_on_message_received = false

# Authorize users to spontaneously upload files with messages — now actually
# persisted (S3-backed storage_provider wired in mirai_hub/data_layer.py,
# unlike the previous version of this app where uploads were silently dropped).
[features.spontaneous_file_upload]
    enabled = true
    accept = ["*/*"]
    max_files = 20
    max_size_mb = 500

[features.audio]
    enabled = false
    sample_rate = 24000

# Chainlit's own MCP feature (the 🔌 composer icon) is DELIBERATELY left
# disabled. Its connections are per-browser-session (localStorage-replayed on
# every socket reconnect), have no relationship to Chainlit threads, and can
# only be opened by a frontend-initiated action — none of which satisfies
# "each thread connects to at most one MCP server, sourced live from Langflow,
# and reconnects on resume". Instead, mirai_hub/mcp_client.py speaks MCP
# directly (official `mcp` SDK) driven by the ChatSettings picker in
# mirai_hub/chat.py / app.py — see infra/apps/mirai-hub/README.md.
[features.mcp]
    enabled = false

[UI]
name = "Mirai Hub"

description = "Trợ lý chat của nền tảng Mirai AI Factory"

# Chain of Thought display — "full" so MCP tool calls (cl.Step) are visible,
# not just cosmetic.
cot = "full"

# The requirement-7 MCP server picker lives in the ChatSettings panel — keep
# it in the sidebar and open by default so it reads as "a screen", not a
# setting buried behind an icon.
chat_settings_location = "sidebar"
default_chat_settings_open = true

confirm_new_chat = true

alert_style = "classic"

[meta]
generated_by = "2.12.0"
