document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"60d933a3-0bb4-412e-b246-d28056bece21\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"b3f520e4-885d-4995-bae0-ff5912d31557\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b2b84785-c7b4-4168-8176-975d91a2be68\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1b34e882-d94a-4137-98e2-353c185dec2d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"433b1a78-beff-4794-80d2-10197a0381f6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f203b27d-5768-4f44-bf75-b129d7a8ed23\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"31c525af-d29a-4033-b579-95345bbde535\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0c377185-e4e1-40c1-8843-cb2d10da907e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F5F7FA;font-family:'Be Vietnam Pro',Calibri,Arial,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#4F46E5;text-decoration:none}\na:hover{color:#3730a3}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:1600px;margin:0 auto;padding:44px 44px 52px;background:#FFFFFF;color:#0F172A;box-sizing:border-box\">\n\n  <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:6px\">\n    <span style=\"width:8px;height:8px;border-radius:50%;background:linear-gradient(90deg,#7C3AED,#22D3EE);display:inline-block\"><\u002Fspan>\n    <span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#4F46E5\">AI Factory Platform / Master architecture<\u002Fspan>\n    <span style=\"margin-left:auto;font-size:12px;color:#94A3B8\">Five horizontal layers and three cross-cutting layers<\u002Fspan>\n  <\u002Fdiv>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.3;margin:0 0 10px\">Data becomes AI models, models become agents, agents become products<\u002Fh1>\n  <p style=\"font-size:15px;line-height:1.8;color:#334155;max-width:112ch;margin:0 0 26px;text-wrap:pretty\">From the bottom up, data becomes AI models, AI models become agents and workflows, and those become products. The three cross-cutting layers run through every layer so that the same discipline applies at each one. The generative AI virtual assistant is the entrance to the whole platform, so that non-engineers can use this equipment too.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:44px 1fr 300px;gap:16px;align-items:stretch\">\n\n    <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:12px;background:linear-gradient(0deg,#334155,#7C3AED);padding:14px 0;color:#fff\">\n      <span style=\"font-size:16px;line-height:1\">▲<\u002Fspan>\n      <span style=\"writing-mode:vertical-rl;font-size:12px;font-weight:700;letter-spacing:.2em\">TO PRODUCT · FROM RAW MATERIAL<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em\">1<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column-reverse;gap:10px\">\n\n      <div style=\"display:grid;grid-template-columns:92px 1fr;border-radius:12px;overflow:hidden;border:1px solid #CBD5E1;background:#fff\">\n        <div style=\"background:#334155;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center\">\n          <span style=\"font-size:26px;font-weight:700;line-height:1\">1<\u002Fspan>\n          <span style=\"font-size:10px;letter-spacing:.1em;opacity:.85\">DATA<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:16px;font-weight:700\">Data management platform and compute<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#64748B\">Raw material and power<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showChips }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <span style=\"font-size:12px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:7px;padding:4px 10px;color:#3b4a63\">Data platform and databases<\u002Fspan>\n              <span style=\"font-size:12px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:7px;padding:4px 10px;color:#3b4a63\">Connectors<\u002Fspan>\n              <span style=\"font-size:12px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:7px;padding:4px 10px;color:#3b4a63\">MILIZE Hub Knowledge<\u002Fspan>\n              <span style=\"font-size:12px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:7px;padding:4px 10px;color:#3b4a63\">GPU compute<\u002Fspan>\n              <span style=\"font-size:12px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:7px;padding:4px 10px;color:#3b4a63\">Data classification labels<\u002Fspan>\n              <span style=\"font-size:12px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:7px;padding:4px 10px;color:#3b4a63\">Customer data governance (external delivery)<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:92px 1fr;border-radius:12px;overflow:hidden;border:1px solid #CBD5E1;background:#fff\">\n        <div style=\"background:#14B8A6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center\">\n          <span style=\"font-size:26px;font-weight:700;line-height:1\">2<\u002Fspan>\n          <span style=\"font-size:10px;letter-spacing:.1em;opacity:.9\">SUPPLY<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:16px;font-weight:700\">Model providers and serving platforms<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#64748B\">Where models are supplied and served from<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showChips }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:10px\">\n              <div style=\"background:#F2FBFA;border:1px solid #A7E3DA;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#0F766E;margin-bottom:6px\">Frontier LLM providers — models consumed as a service<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #A7E3DA;border-radius:7px;padding:4px 9px;color:#0F766E\">Anthropic<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #A7E3DA;border-radius:7px;padding:4px 9px;color:#0F766E\">OpenAI<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #A7E3DA;border-radius:7px;padding:4px 9px;color:#0F766E\">Google Gemini<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #A7E3DA;border-radius:7px;padding:4px 9px;color:#0F766E\">Domestic and regional providers<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #A7E3DA;border-radius:7px;padding:4px 9px;color:#0F766E\">Open-weight model families<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F5FCFB;border:1px solid #CCEBE5;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#0F766E;margin-bottom:6px\">Serving platforms for fine-tuned models<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #CCEBE5;border-radius:7px;padding:4px 9px;color:#0F766E\">Azure AI Foundry<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #CCEBE5;border-radius:7px;padding:4px 9px;color:#0F766E\">Amazon Bedrock / SageMaker<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #CCEBE5;border-radius:7px;padding:4px 9px;color:#0F766E\">Google Vertex AI<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #CCEBE5;border-radius:7px;padding:4px 9px;color:#0F766E\">Self-hosted GPU serving<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #CCEBE5;border-radius:7px;padding:4px 9px;color:#0F766E\">Fine-tuning and evaluation jobs<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:11.6px;color:#41506b;line-height:1.65\">Nothing above this layer talks to a provider directly. Every endpoint supplied here is registered in the layer-3 hub, which is what makes providers interchangeable.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:92px 1fr;border-radius:12px;overflow:hidden;border:1px solid #CBD5E1;background:#fff\">\n        <div style=\"background:#22D3EE;color:#082F35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center\">\n          <span style=\"font-size:26px;font-weight:700;line-height:1\">3<\u002Fspan>\n          <span style=\"font-size:10px;letter-spacing:.1em;opacity:.75\">AI HUB<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:16px;font-weight:700\">AI Hub &amp; AI Model Catalog — one entry point to every model<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#64748B\">Single gateway and parts warehouse<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showChips }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:10px\">\n              <div style=\"background:#E0FAFF;border:1px solid #BEEEF8;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#0E7490;margin-bottom:6px\">AI Hub — unified control over all AI access<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #BEEEF8;border-radius:7px;padding:4px 9px;color:#0E7490\">Unified gateway and key management<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #BEEEF8;border-radius:7px;padding:4px 9px;color:#0E7490\">Cost management and quotas<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #BEEEF8;border-radius:7px;padding:4px 9px;color:#0E7490\">Logging<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #BEEEF8;border-radius:7px;padding:4px 9px;color:#0E7490\">Tracing<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #BEEEF8;border-radius:7px;padding:4px 9px;color:#0E7490\">Team and org management<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #BEEEF8;border-radius:7px;padding:4px 9px;color:#0E7490\">Vendor governance for layer 2 models<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F5FDFF;border:1px solid #D3F1F9;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#0E7490;margin-bottom:6px\">AI Model Catalog — the registered assets<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #D3F1F9;border-radius:7px;padding:4px 9px;color:#0E7490\">External APIs (GPT, Claude, Gemini, etc.)<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #D3F1F9;border-radius:7px;padding:4px 9px;color:#0E7490\">Self-hosted open-weight models<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #D3F1F9;border-radius:7px;padding:4px 9px;color:#0E7490\">Fine-tuned models<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #D3F1F9;border-radius:7px;padding:4px 9px;color:#0E7490\">Speech, image, document and tabular models<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:11.6px;color:#41506b;line-height:1.65\">Every layer above calls AI only through this hub, so cost, logs, traces and access rights for all vendor models produced or procured at layer 2 are consolidated in one place.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:92px 1fr;border-radius:12px;overflow:hidden;border:1px solid #CBD5E1;background:#fff\">\n        <div style=\"background:#4F46E5;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center\">\n          <span style=\"font-size:26px;font-weight:700;line-height:1\">4<\u002Fspan>\n          <span style=\"font-size:10px;letter-spacing:.1em;opacity:.85\">AGENTS<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:16px;font-weight:700\">Agent &amp; Workflow Factory — five factories and the Agent Catalog<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#64748B\">Parts production and parts warehouse<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showChips }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:10px\">\n              <div style=\"background:#EEF0FE;border:1px solid #C4C7FA;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#3730a3;margin-bottom:6px\">Five factories — where reusable parts are built<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:6px\">\n                  <div style=\"background:#fff;border:1px solid #C4C7FA;border-radius:7px;padding:8px 8px\">\n                    <div style=\"font-size:11.6px;font-weight:700;color:#3730a3;line-height:1.35\">System Prompt Factory<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#41506b;line-height:1.55;margin-top:3px\">Role, policy and tone templates per business domain<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:#fff;border:1px solid #C4C7FA;border-radius:7px;padding:8px 8px\">\n                    <div style=\"font-size:11.6px;font-weight:700;color:#3730a3;line-height:1.35\">Tool Factory<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#41506b;line-height:1.55;margin-top:3px\">API and data-access tools with permission scopes<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:#fff;border:1px solid #C4C7FA;border-radius:7px;padding:8px 8px\">\n                    <div style=\"font-size:11.6px;font-weight:700;color:#3730a3;line-height:1.35\">Skill Factory<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#41506b;line-height:1.55;margin-top:3px\">Packaged financial know-how a model can execute<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:#fff;border:1px solid #C4C7FA;border-radius:7px;padding:8px 8px\">\n                    <div style=\"font-size:11.6px;font-weight:700;color:#3730a3;line-height:1.35\">Workflow Factory<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#41506b;line-height:1.55;margin-top:3px\">Multi-step orchestration, hand-offs and human approval points<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:#fff;border:1px solid #C4C7FA;border-radius:7px;padding:8px 8px\">\n                    <div style=\"font-size:11.6px;font-weight:700;color:#3730a3;line-height:1.35\">Evaluation Factory<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#41506b;line-height:1.55;margin-top:3px\">Test sets, scoring and regression runs before release<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F8FF;border:1px solid #DADCFC;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#3730a3;margin-bottom:6px\">Agent Catalog &amp; Registry — the registered assets<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DADCFC;border-radius:7px;padding:4px 9px;color:#3730a3\">Agents by business domain<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DADCFC;border-radius:7px;padding:4px 9px;color:#3730a3\">Skills, tools and workflows<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DADCFC;border-radius:7px;padding:4px 9px;color:#3730a3\">MCP servers and connections<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DADCFC;border-radius:7px;padding:4px 9px;color:#3730a3\">Versioning and ownership<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DADCFC;border-radius:7px;padding:4px 9px;color:#3730a3\">Evaluation results per version<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DADCFC;border-radius:7px;padding:4px 9px;color:#3730a3\">Reuse metrics and asset contribution<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:11.6px;color:#41506b;line-height:1.65\">Agents call models only through the layer-3 hub. Anything built for an engagement is registered here, so the next engagement assembles from existing parts instead of rebuilding them.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:92px 1fr;border-radius:12px;overflow:hidden;border:1px solid #CBD5E1;background:#fff\">\n        <div style=\"background:#7C3AED;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center\">\n          <span style=\"font-size:26px;font-weight:700;line-height:1\">5<\u002Fspan>\n          <span style=\"font-size:10px;letter-spacing:.1em;opacity:.85\">PRODUCTS<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:16px;font-weight:700\">MIRAI AI Hub / MILIZE AI Hub — where users meet the platform<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#64748B\">Assembly line and delivery surface<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showChips }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:10px\">\n              <div style=\"background:#FBF8FF;border:1px solid #DDD0FA;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#5b21b6;margin-bottom:6px\">The hub — one portal, shared chassis, business cassettes<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DDD0FA;border-radius:7px;padding:4px 9px;color:#5b21b6\">Single sign-on and role-based access<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DDD0FA;border-radius:7px;padding:4px 9px;color:#5b21b6\">Chat and assistant workspace<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DDD0FA;border-radius:7px;padding:4px 9px;color:#5b21b6\">App directory built on the shared chassis<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DDD0FA;border-radius:7px;padding:4px 9px;color:#5b21b6\">Web and mobile clients<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #DDD0FA;border-radius:7px;padding:4px 9px;color:#5b21b6\">Tenant separation for internal and customer use<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FDFBFF;border:1px solid #EADFFB;border-radius:9px;padding:10px 12px\">\n                <div style=\"font-size:12.4px;font-weight:700;color:#5b21b6;margin-bottom:6px\">Business use cases delivered on it<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #EADFFB;border-radius:7px;padding:4px 9px;color:#5b21b6\">AI-FP / AI-FM / AI-CR / AI-CFO<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #EADFFB;border-radius:7px;padding:4px 9px;color:#5b21b6\">Banking, securities, insurance, corporate<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #EADFFB;border-radius:7px;padding:4px 9px;color:#5b21b6\">Back-office and reporting automation<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #EADFFB;border-radius:7px;padding:4px 9px;color:#5b21b6\">Customer-facing advisory tools<\u002Fspan>\n                  <span style=\"font-size:11.6px;background:#fff;border:1px solid #EADFFB;border-radius:7px;padding:4px 9px;color:#5b21b6\">New use cases added as cassettes<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:11.6px;color:#41506b;line-height:1.65\">A new use case ships as a cassette on the shared chassis, so the hub grows by addition rather than by a new application each time.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"flex:1;border-radius:12px;padding:15px 16px;color:#fff;background:linear-gradient(160deg,#0C1330,#26306b);display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">MILIZE Control Tower<\u002Fdiv>\n        <div style=\"font-size:11.8px;line-height:1.65;color:#C6CFEA\">Financial-grade guardrails, policy as code, audit trails, evaluation and regression testing, cost control, cross-border data governance<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;border-radius:12px;padding:15px 16px;color:#fff;background:linear-gradient(160deg,#155e75,#0e7490);display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">CI/CD<\u002Fdiv>\n        <div style=\"font-size:11.8px;line-height:1.65;color:#D6F1F8\">Version control, automated testing, staged release, automatic rollback<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;border-radius:12px;padding:15px 16px;color:#fff;background:linear-gradient(160deg,#5b21b6,#7c3aed);display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">External system integration<\u002Fdiv>\n        <div style=\"font-size:11.8px;line-height:1.65;color:#E7DCFB\">Connections to core banking systems, existing SaaS and customer-side platforms. Adding capability to existing systems takes priority over building new ones<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"margin-top:12px;display:grid;grid-template-columns:44px 1fr 300px;gap:16px\">\n    <div><\u002Fdiv>\n    <div style=\"padding:16px 18px;border-radius:12px;background:linear-gradient(100deg,#0C1330,#26306b);color:#fff\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:6px\">Generative AI virtual assistant — the entrance to every layer<\u002Fdiv>\n      <div style=\"font-size:12.2px;line-height:1.75;color:#C6CFEA;text-wrap:pretty\">Through dialogue, the assistant combines existing assets from layers 3, 4 and 5 into deliverables. Missing parts are produced in layers 3 and 4, then registered in the Registry so the next engagement can use them. Sales and technical presales use it to structure requirements and draft proposals; engineers use it from prototype through production build.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px dashed #CBD5E1;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.1em;color:#94A3B8;margin-bottom:6px\">READING THE CROSS-CUTTING LAYERS<\u002Fdiv>\n      <div style=\"font-size:11.8px;line-height:1.7;color:#41506b\">The three layers run through layers 1 to 5. What an audit asks for is a single line that crosses all layers.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showNote }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:22px;padding:18px 20px;background:#F5F7FA;border:1px solid #E2E5EA;border-radius:12px\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#4F46E5;margin-bottom:9px\">Notes<\u002Fdiv>\n      <p style=\"font-size:13.2px;line-height:1.85;color:#293548;margin:0 0 9px;text-wrap:pretty\">Assets in layers 3 and 4 do not shrink as they are used; they grow. Every new part built for an engagement is registered in the Registry and becomes available to the next one.<\u002Fp>\n      <p style=\"font-size:13.2px;line-height:1.85;color:#293548;margin:0;text-wrap:pretty\">Where a customer already owns a data platform, the AI Factory Platform is deployed on top of it. Layer 1 does not have to be rebuilt.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600},&quot;showChips&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;showNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showChips: this.props.showChips ?? true,\n      showNote: this.props.showNote ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
